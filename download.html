<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body { 
            font-family: 'Segoe UI', Arial, sans-serif;

            color: #333;

<body>
    <div class="container">
        <h1>NeoScreenHub</h1>
        <p>Inserisci la password per scaricare l'ultima versione</p>
        
        <input type="password" id="pass" placeholder="Inserisci password">
        <br><br>

    <script>
        function checkPassword() {
            const password = document.getElementById("pass").value;
            
            if (password === "12345678") {   // ← Cambia qui
                // Questo link scarica automaticamente l'ultimo asset della release
                window.location.href = "https://github.com/velodent/neoscreenhub/releases/latest/download/NeoScreenHub-Setup.exe";
            } else {
                alert("Password errata!");

        }
